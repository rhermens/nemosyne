[project]
name = "nemosyne"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.29.0,<2",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.29.0",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
]

[project.scripts]
daemon = "nemosyne.cli.daemon:main"
auth = "nemosyne.cli.auth:main"
debug = "nemosyne.cli.debug:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
]

[tool.poe.tasks]
test = "pytest -s"
typecheck = "basedpyright ."
check = [
   { cmd = "ruff check ." },
   { cmd = "basedpyright ." },
   { cmd = "python -m compileall -q nemosyne" },
]
